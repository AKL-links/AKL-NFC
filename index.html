
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>AKL Personalizados</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #080808;
  color: #f5f1e8;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  padding: 45px 20px;
}

.pagina {
  width: 100%;
  max-width: 430px;
  text-align: center;
}

/* LOGO FEITO DIRETAMENTE NO CÓDIGO */
.logo {
  padding: 28px 0 20px;
}

.logo-akl {
  font-family: "Times New Roman", Georgia, serif;
  font-size: clamp(85px, 24vw, 125px);
  font-weight: normal;
  letter-spacing: -7px;
  line-height: 1;
  background: linear-gradient(
    180deg,
    #fff0bb 0%,
    #d7ad55 24%,
    #89601d 48%,
    #f5d889 68%,
    #b88632 100%
  );
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 2px 8px #bd8b3028);
}

.logo-linha {
  width: 180px;
  height: 1px;
  margin: 8px auto;
  background: linear-gradient(
    90deg, transparent, #b98d42, transparent
  );
}

.logo-sub {
  font-family: Georgia, serif;
  font-size: 11px;
  letter-spacing: 5px;
  color: #c4a061;
}

.descricao {
  margin: 28px auto 36px;
  max-width: 310px;
  color: #bcb1a0;
  font-size: 14px;
  line-height: 1.7;
}

.botao {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  min-height: 88px;
  padding: 17px 20px;
  margin-bottom: 16px;
  border: 1px solid #987438;
  border-radius: 18px;
  background: linear-gradient(
    135deg, #201b14, #111111 65%
  );
  color: white;
  text-decoration: none;
  text-align: left;
  box-shadow: 0 4px 18px #b8892418;
  cursor: pointer;
  font: inherit;
  transition: .2s;
}

.botao:hover {
  border-color: #e2b65d;
  transform: translateY(-2px);
  box-shadow: 0 5px 22px #b8892435;
}

.icone {
  width: 44px;
  text-align: center;
  font-size: 29px;
  flex-shrink: 0;
}

.info { flex: 1; min-width: 0; }

.nome {
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 6px;
}

.detalhe {
  color: #d8b36b;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.seta {
  color: #d8b36b;
  font-size: 25px;
}

.servicos {
  display: flex;
  justify-content: space-around;
  gap: 12px;
  margin-top: 38px;
  padding-top: 24px;
  border-top: 1px solid #47351d;
  color: #caa45e;
  font-size: 12px;
  letter-spacing: 1px;
}

footer {
  margin-top: 45px;
  color: #817463;
  font-size: 11px;
  letter-spacing: 1px;
}
</style>
</head>

<body>
<main class="pagina">

  <header class="logo">
    <div class="logo-akl">AKL</div>
    <div class="logo-linha"></div>
    <div class="logo-sub">PERSONALIZADOS</div>
  </header>

  <p class="descricao">
    Transformamos ideias em detalhes únicos.
    Tecnologia, criatividade e personalização.
  </p>

  <a class="botao"
     href="https://www.instagram.com/aklpersonalizados_/"
     target="_blank" rel="noopener noreferrer">

<span class="icone">
  <svg viewBox="0 0 24 24" width="36" height="36"
       fill="none" stroke="#E1306C"
       stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round">
    <rect x="2" y="2" width="20" height="20" rx="5"/>
    <circle cx="12" cy="12" r="4"/>
    <circle cx="18" cy="6" r="1" fill="#E1306C"/>
  </svg>
</span>
    
    <div class="info">
      <div class="nome">Instagram</div>
      <div class="detalhe">@aklpersonalizados_</div>
    </div>
    <span class="seta">›</span>
  </a>

  <a class="botao"
     href="https://wa.me/5551997166602"
     target="_blank" rel="noopener noreferrer">
    <span class="icone">
  <svg viewBox="0 0 24 24" width="38" height="38"
       fill="none" stroke="#25D366"
       stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round">
    <path d="M21 11.5a8.5 8.5 0 0 1-12.5 7.5L3 21l2-5.5A8.5 8.5 0 1 1 21 11.5Z"/>
    <path d="M9 8c0 4 3 7 7 7l1.5-2-3-1.5-1.5 1.5a6 6 0 0 1-2-2L12.5 9 11 6 9 8Z"/>
  </svg>
</span>
    <div class="info">
      <div class="nome">WhatsApp</div>
      <div class="detalhe">Fale conosco</div>
    </div>
    <span class="seta">›</span>
  </a>

  <button class="botao" onclick="copiarPix()">
    <span class="icone">◆</span>
    <div class="info">
      <div class="nome">Chave Pix</div>
      <div class="detalhe" id="textoPix">
        Toque para copiar a chave
      </div>
    </div>
    <span class="seta">⧉</span>
  </button>

  <section class="servicos">
    <span>✦ IMPRESSÃO 3D</span>
    <span>✦ CORTE A LASER</span>
  </section>

  <footer>© AKL PERSONALIZADOS</footer>

</main>

<script>
const chavePix = "04079087063";

async function copiarPix() {
  const texto = document.getElementById("textoPix");
  try {
    await navigator.clipboard.writeText(chavePix);
    texto.textContent = "Chave copiada com sucesso!";
  } catch (erro) {
    texto.textContent = "Chave: " + chavePix;
  }
}
</script>
</body>
</html>
