
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>AKL Personalizados</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: #f5f1e8;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 32px 18px;
    }

    .pagina {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      width: 100%;
      max-width: 320px;
      display: block;
      margin: 12px auto 8px;
      border-radius: 16px;
    }

    h1 {
      font-size: 16px;
      letter-spacing: 5px;
      font-weight: 500;
      margin: 20px 0 12px;
      color: #f4e7c8;
    }

    .linha {
      height: 1px;
      width: 65%;
      margin: 18px auto 24px;
      background: linear-gradient(
        90deg, transparent, #d5a84b, transparent
      );
    }

    .descricao {
      color: #b9ad97;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .botao {
      display: flex;
      align-items: center;
      gap: 17px;
      text-decoration: none;
      color: white;
      padding: 19px;
      margin-bottom: 16px;
      border: 1px solid #9e7936;
      border-radius: 18px;
      background: linear-gradient(
        135deg, #24201a, #111111 65%
      );
      box-shadow: 0 3px 15px #c7953020;
      transition: 0.25s;
      text-align: left;
    }

    .botao:hover {
      transform: translateY(-3px);
      border-color: #e7bc62;
      box-shadow: 0 5px 22px #c7953040;
    }

    .icone {
      font-size: 29px;
      width: 42px;
      text-align: center;
      flex-shrink: 0;
    }

    .conteudo { flex: 1; min-width: 0; }

    .nome {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .detalhe {
      font-size: 13px;
      color: #d8b76b;
      overflow-wrap: anywhere;
    }

    .seta {
      color: #d9b45d;
      font-size: 24px;
    }

    .pix { cursor: pointer; width: 100%; font: inherit; }

    .servicos {
      margin-top: 35px;
      padding-top: 24px;
      border-top: 1px solid #493a22;
      display: flex;
      justify-content: space-around;
      gap: 10px;
      color: #d3ae62;
      font-size: 12px;
      letter-spacing: 1px;
    }

    footer {
      margin-top: 42px;
      font-size: 11px;
      color: #807667;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <main class="pagina">

   
    <h1>AKL PERSONALIZADOS</h1>
    <div class="linha"></div>

    <p class="descricao">
      Tecnologia, criatividade e personalização
      em cada detalhe.
    </p>

    <a class="botao"
       href="https://www.instagram.com/aklpersonalizados_/"
       target="_blank" rel="noopener noreferrer">
      <span class="icone">📸</span>
      <div class="conteudo">
        <div class="nome">Instagram</div>
        <div class="detalhe">@aklpersonalizados_</div>
      </div>
      <span class="seta">›</span>
    </a>

    <a class="botao"
       href="https://wa.me/5551997166602"
       target="_blank" rel="noopener noreferrer">
      <span class="icone">💬</span>
      <div class="conteudo">
        <div class="nome">WhatsApp</div>
        <div class="detalhe">Fale conosco</div>
      </div>
      <span class="seta">›</span>
    </a>

    <button class="botao pix"
            onclick="copiarPix()">
      <span class="icone">◆</span>
      <div class="conteudo">
        <div class="nome">Chave Pix</div>
        <div class="detalhe" id="textoPix">
          Toque para copiar a chave
        </div>
      </div>
      <span class="seta">⧉</span>
    </button>

    <section class="servicos">
      <span>✦ IMPRESSÃO 3D</span>
      <span>✦ CORTE A LASER</span>
    </section>

    <footer>
      © AKL PERSONALIZADOS
    </footer>

  </main>

  <script>
    const chavePix = "04079087063";

    async function copiarPix() {
      try {
        await navigator.clipboard.writeText(chavePix);
        document.getElementById("textoPix").textContent =
          "Chave copiada com sucesso!";
      } catch (erro) {
        document.getElementById("textoPix").textContent =
          "Chave: " + chavePix;
      }
    }
  </script>
</body>
</html>
